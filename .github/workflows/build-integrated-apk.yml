name: Build MarshallStock Integrated APK

on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'tools/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - '.github/workflows/build-integrated-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record current run ID
        run: |
          mkdir -p integrated
          echo "${{ github.run_id }}" > integrated/current_run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add integrated/current_run.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record integrated APK run [skip ci]'
            git push
          fi

      - name: Apply runtime compatibility fixes
        run: |
          python3 tools/apply_v12_runtime_fixes.py
          python3 tools/fix_v12_lambda.py
          python3 tools/apply_v13_sector_fallbacks.py
          python3 tools/fix_v13_java_strings.py
          python3 tools/apply_v14_identity.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MarshallStock-Integrated-v1.4-FIX.apk
          ls -lh MarshallStock-Integrated-v1.4-FIX.apk
          sha256sum MarshallStock-Integrated-v1.4-FIX.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarshallStock-Integrated-v1.4-FIX-APK
          path: MarshallStock-Integrated-v1.4-FIX.apk
          if-no-files-found: error
          retention-days: 30
