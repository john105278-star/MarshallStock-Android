name: Build MarshallStock Windows v2 EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'windows/v2payload.txt'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record current run ID
        shell: pwsh
        run: |
          Set-Content -Path 'windows/current_windows_run.txt' -Value '${{ github.run_id }}' -Encoding ascii
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/current_windows_run.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Record current Windows v2 run [skip ci]'
            git push
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore and syntax-check app source
        shell: pwsh
        run: |
          $b64 = (Get-Content 'windows/v2payload.txt' -Raw).Trim()
          $bytes = [Convert]::FromBase64String($b64)
          $ms = [IO.MemoryStream]::new($bytes)
          $gz = [IO.Compression.GzipStream]::new($ms, [IO.Compression.CompressionMode]::Decompress)
          $out = [IO.File]::Create('marshall_stock_windows.py')
          $gz.CopyTo($out)
          $out.Close(); $gz.Close(); $ms.Close()
          python -m py_compile marshall_stock_windows.py

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests==2.32.3 pyinstaller==6.10.0

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MarshallStock-Windows-v2.0 marshall_stock_windows.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = 'dist/MarshallStock-Windows-v2.0.exe'
          if (!(Test-Path $exe)) { throw 'EXE file was not created.' }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MarshallStock-Windows-v2.0-EXE
          path: dist/MarshallStock-Windows-v2.0.exe
          if-no-files-found: error
          retention-days: 30

      - name: Record successful run ID
        shell: pwsh
        run: |
          Set-Content -Path 'windows/latest_windows_run.txt' -Value '${{ github.run_id }}' -Encoding ascii
          git pull --rebase
          git add windows/latest_windows_run.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Record latest Windows v2 EXE run [skip ci]'
            git push
          }
