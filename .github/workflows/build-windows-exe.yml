name: Build MarshallStock Windows v3.0 PRO EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'windows/v30payload/**'
      - 'windows/marshall_stock_v30.py'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Reconstruct v3.0 source
        shell: pwsh
        run: |
          $payload = ((Get-Content 'windows/v30payload/part00.txt' -Raw) + (Get-Content 'windows/v30payload/part01.txt' -Raw) + (Get-Content 'windows/v30payload/part02.txt' -Raw) + (Get-Content 'windows/v30payload/part03.txt' -Raw)).Trim()
          [IO.File]::WriteAllBytes('windows/marshall_stock_v30.py', [Convert]::FromBase64String($payload))
          python -m py_compile windows/marshall_stock_v30.py

      - name: Install PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller==6.10.0

      - name: Build portable EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name MarshallStock-PRO-v3.0 windows/marshall_stock_v30.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = 'dist/MarshallStock-PRO-v3.0.exe'
          if (!(Test-Path $exe)) { throw 'EXE file was not created.' }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: MarshallStock-PRO-v3.0-Windows-EXE
          path: dist/MarshallStock-PRO-v3.0.exe
          if-no-files-found: error
          retention-days: 30

      - name: Record latest successful run ID
        shell: pwsh
        run: |
          Set-Content -Path 'windows/latest_windows_run.txt' -Value '${{ github.run_id }}' -Encoding ascii
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add windows/latest_windows_run.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Record latest Windows v3.0 PRO EXE run [skip ci]'
            git push
          }
