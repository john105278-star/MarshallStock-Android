name: Build Windows Stock Analyzer EXE

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'windows/v15parts/**'
      - '.github/workflows/build-windows-exe.yml'

permissions:
  contents: write

jobs:
  build-windows-exe:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record current run ID
        shell: pwsh
        run: |
          Set-Content -Path 'windows/current_windows_run.txt' -Value '${{ github.run_id }}' -Encoding ascii
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add windows/current_windows_run.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Record current Windows EXE run [skip ci]'
            git push
          }

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Reconstruct and verify source package
        shell: pwsh
        run: |
          $parts = Get-ChildItem 'windows/v15parts/part*.txt' | Sort-Object Name
          if ($parts.Count -ne 10) { throw "Expected 10 source parts, found $($parts.Count)." }
          $b64 = ($parts | ForEach-Object { (Get-Content $_.FullName -Raw).Trim() }) -join ''
          [IO.File]::WriteAllBytes('windows/stock_ai_v1_5.zip', [Convert]::FromBase64String($b64))
          $hash = (Get-FileHash 'windows/stock_ai_v1_5.zip' -Algorithm SHA256).Hash.ToLower()
          Write-Host "Source ZIP SHA256: $hash"
          if ($hash -ne 'ec358ab8b19e8671ad26dec3b9ab2bdbec809890c79eafaccc5053e9352dba38') {
            throw "ZIP SHA256 mismatch: $hash"
          }
          New-Item -ItemType Directory -Force -Path 'windows/src' | Out-Null
          Expand-Archive -Path 'windows/stock_ai_v1_5.zip' -DestinationPath 'windows/src' -Force
          Get-ChildItem 'windows/src'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r windows/src/requirements.txt
          python -m pip install --upgrade pyinstaller

      - name: Syntax check
        shell: pwsh
        run: |
          python -m py_compile windows/src/stock_ai_analyzer_v1_5.py

      - name: Build EXE
        shell: pwsh
        working-directory: windows/src
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name StockAIAnalyzer_v1_5 `
            --collect-all yfinance `
            --collect-all FinanceDataReader `
            --collect-all pykrx `
            --collect-all matplotlib `
            --collect-all openai `
            --collect-all bs4 `
            stock_ai_analyzer_v1_5.py

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = 'windows/src/dist/StockAIAnalyzer_v1_5.exe'
          if (!(Test-Path $exe)) { throw 'EXE file was not created.' }
          Get-Item $exe | Format-List Name,Length,LastWriteTime
          Get-FileHash $exe -Algorithm SHA256

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: StockAIAnalyzer-v1.5-Windows-EXE
          path: windows/src/dist/StockAIAnalyzer_v1_5.exe
          if-no-files-found: error
          retention-days: 30

      - name: Record successful run ID
        shell: pwsh
        run: |
          Set-Content -Path 'windows/latest_windows_run.txt' -Value '${{ github.run_id }}' -Encoding ascii
          git pull --rebase
          git add windows/latest_windows_run.txt
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m 'Record latest successful Windows EXE run [skip ci]'
            git push
          }
