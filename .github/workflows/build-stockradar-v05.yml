name: Build Stock Radar v0.5

on:
  push:
    branches: [ main ]
    paths:
      - 'stockradar/parts/**'
      - 'stockradar_v03/SignalEngine.java'
      - 'stockradar_v04/**'
      - 'stockradar_v05/**'
      - '.github/workflows/build-stockradar-v05.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Reconstruct base project
        shell: bash
        run: |
          rm -rf stockradar/build_v05
          mkdir -p stockradar/build_v05
          cat stockradar/parts/part_*.txt > stockradar/source_v05.zip.b64
          base64 -d stockradar/source_v05.zip.b64 > stockradar/source_v05.zip
          unzip -q stockradar/source_v05.zip -x 'StockRadarMVP/docs/*' -d stockradar/build_v05
          test -f stockradar/build_v05/StockRadarMVP/app/src/main/AndroidManifest.xml

      - name: Apply v0.5 source overlays
        shell: bash
        run: |
          APP=stockradar/build_v05/StockRadarMVP/app/src/main/java/com/stockradar/app
          cp stockradar_v05/MainActivity.java "$APP/MainActivity.java"
          cp stockradar_v05/SettingsActivity.java "$APP/SettingsActivity.java"
          cp stockradar_v05/KiwoomClient.java "$APP/api/KiwoomClient.java"
          cp stockradar_v05/ScannerRepository.java "$APP/data/ScannerRepository.java"
          cp stockradar_v03/SignalEngine.java "$APP/core/SignalEngine.java"
          cp stockradar_v04/ChartActivity.java "$APP/ChartActivity.java"
          cp stockradar_v04/ReboundChartView.java "$APP/ReboundChartView.java"
          cp stockradar_v05/LongTermScoreEngine.java "$APP/core/LongTermScoreEngine.java"
          cp stockradar_v05/WatchlistActivity.java "$APP/WatchlistActivity.java"
          cp stockradar_v05/SectorBarView.java "$APP/SectorBarView.java"
          cp stockradar_v05/SectorFlowActivity.java "$APP/SectorFlowActivity.java"

          python - <<'PY'
          from pathlib import Path
          p=Path('stockradar/build_v05/StockRadarMVP/app/build.gradle')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s+\d+', 'versionCode 5', s)
          s=re.sub(r"versionName\s+'[^']+'", "versionName '0.5.0'", s)
          p.write_text(s)

          p=Path('stockradar/build_v05/StockRadarMVP/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          activities=['.ChartActivity','.WatchlistActivity','.SectorFlowActivity']
          for activity in activities:
              if activity not in s:
                  s=s.replace('<activity android:name=".SettingsActivity" />', f'<activity android:name="{activity}" />\n        <activity android:name=".SettingsActivity" />')
          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: stockradar/build_v05/StockRadarMVP
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          APK=stockradar/build_v05/StockRadarMVP/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          cp "$APK" StockRadar-v0.5-watchlist-sector.apk
          file StockRadar-v0.5-watchlist-sector.apk
          sha256sum StockRadar-v0.5-watchlist-sector.apk
          ls -lh StockRadar-v0.5-watchlist-sector.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockRadar-v0.5-watchlist-sector-APK
          path: StockRadar-v0.5-watchlist-sector.apk
          if-no-files-found: error
          retention-days: 30
