name: Build Marshall Stock Home Widget APK

on:
  push:
    branches: [ main ]
    paths:
      - 'widget/buildsrc.tar.xz.b64.txt'
      - '.github/workflows/build-stock-widget.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-widget:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK on preinstalled runner
        run: |
          echo "y" | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract and validate widget project
        run: |
          mkdir -p widget/project
          base64 -d widget/buildsrc.tar.xz.b64.txt > widget/source.tar.xz
          echo "5e687b91bb07c54782422e9a90eabf977043a761ad9e74b9674c8cf1a7ceffca  widget/source.tar.xz" | sha256sum -c
          tar -xJf widget/source.tar.xz -C widget/project
          test -f widget/project/app/src/main/AndroidManifest.xml
          test -f widget/project/app/src/main/java/kr/marshall/stockwidget/TickerService.java
          test -f widget/project/app/src/main/java/kr/marshall/stockwidget/StockWidgetProvider.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: widget/project
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          test -s widget/project/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p widget/release
          cp widget/project/app/build/outputs/apk/debug/app-debug.apk widget/release/MarshallStockWidget-v1.0-debug.apk
          ls -lh widget/release/*.apk
          sha256sum widget/release/*.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging widget/release/*.apk | head -12

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: MarshallStockWidget-v1.0-APK
          path: widget/release/MarshallStockWidget-v1.0-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK in repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f widget/release/MarshallStockWidget-v1.0-debug.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Marshall Stock Widget debug APK [skip ci]"
            git push
          fi
