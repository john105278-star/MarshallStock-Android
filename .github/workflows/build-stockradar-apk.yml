name: Build Stock Radar APK

on:
  push:
    branches: [ main ]
    paths:
      - 'stockradar/parts/**'
      - '.github/workflows/build-stockradar-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          sdkmanager --list_installed | head -100

      - name: Reconstruct Stock Radar project
        shell: bash
        run: |
          mkdir -p stockradar/build
          cat stockradar/parts/part_*.txt > stockradar/source.zip.b64
          base64 -d stockradar/source.zip.b64 > stockradar/source.zip
          unzip -t stockradar/source.zip
          unzip -q stockradar/source.zip -d stockradar/build
          test -f stockradar/build/StockRadarMVP/app/src/main/java/com/stockradar/app/MainActivity.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: stockradar/build/StockRadarMVP
        shell: bash
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and rename APK
        shell: bash
        run: |
          test -f stockradar/build/StockRadarMVP/app/build/outputs/apk/debug/app-debug.apk
          cp stockradar/build/StockRadarMVP/app/build/outputs/apk/debug/app-debug.apk StockRadar-v0.1-debug.apk
          ls -lh StockRadar-v0.1-debug.apk
          sha256sum StockRadar-v0.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StockRadar-v0.1-APK
          path: StockRadar-v0.1-debug.apk
          if-no-files-found: error
          retention-days: 30
