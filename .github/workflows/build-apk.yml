name: Build MarshallStock Kiwoom APK

on:
  push:
    branches: [ main ]
    paths:
      - 'kiwoom/parts/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Record current run ID
        run: |
          mkdir -p kiwoom
          echo "${{ github.run_id }}" > kiwoom/current_run.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add kiwoom/current_run.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record current Kiwoom APK run [skip ci]'
            git push
          fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: yes | sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Reconstruct Kiwoom Android project
        run: |
          cat kiwoom/parts/part_*.txt > kiwoom/kiwoom_app_v1.zip.b64
          base64 -d kiwoom/kiwoom_app_v1.zip.b64 > kiwoom/kiwoom_app_v1.zip
          unzip -t kiwoom/kiwoom_app_v1.zip
          rm -rf app
          unzip -q kiwoom/kiwoom_app_v1.zip -d .
          test -f app/src/main/java/com/marshall/kiwoomstock/MainActivity.java
          test -f app/src/main/java/com/marshall/kiwoomstock/KiwoomClient.java
          test -f app/src/main/java/com/marshall/kiwoomstock/KiwoomSocket.java

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify and rename APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk MarshallStock-Kiwoom-v1.0.apk
          ls -lh MarshallStock-Kiwoom-v1.0.apk
          sha256sum MarshallStock-Kiwoom-v1.0.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarshallStock-Kiwoom-v1.0-APK
          path: MarshallStock-Kiwoom-v1.0.apk
          if-no-files-found: error
          retention-days: 30
