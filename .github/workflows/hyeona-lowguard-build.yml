name: Inspect Hyeona Low Guard v1.2
on:
  push:
    branches: [ hyeona-lowguard-build ]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect Nightscout device status
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request, datetime
          base='https://hyeona.up.railway.app'
          urls=[
            ('entries', base+'/api/v1/entries.json?count=3'),
            ('devicestatus', base+'/api/v1/devicestatus.json?count=3'),
            ('status', base+'/api/v1/status.json'),
          ]
          for name,url in urls:
            print('\n###', name)
            req=urllib.request.Request(url, headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'HyeonaLowGuard-inspect/1.3'})
            try:
              with urllib.request.urlopen(req, timeout=15) as r:
                data=json.load(r)
              print(json.dumps(data, ensure_ascii=False, indent=2)[:25000])
            except Exception as e:
              print('ERROR', repr(e))
          PY
      - name: Recreate v1.1 project
        shell: bash
        run: |
          cat hyeona_build_parts/part*.txt > /tmp/hyeona.b64
          base64 -d /tmp/hyeona.b64 > /tmp/HyeonaLowGuard_Android_Project.zip
          mkdir -p /tmp/hyeona-src
          unzip -q /tmp/HyeonaLowGuard_Android_Project.zip -d /tmp/hyeona-src
      - name: Apply v1.2 prediction patch
        shell: bash
        run: |
          base64 -d hyeona_v12_patch.py.gz.b64 | gzip -d > /tmp/hyeona_v12_patch.py
          python /tmp/hyeona_v12_patch.py /tmp/hyeona-src/HyeonaLowGuard
          grep -q "versionName '1.2.0'" /tmp/hyeona-src/HyeonaLowGuard/app/build.gradle
      - name: Package v1.2 source
        shell: bash
        run: |
          cd /tmp/hyeona-src
          zip -qr /tmp/HyeonaLowGuard-v1.2-source.zip HyeonaLowGuard
      - uses: actions/upload-artifact@v4
        with:
          name: HyeonaLowGuard-v1.2-source
          path: /tmp/HyeonaLowGuard-v1.2-source.zip
