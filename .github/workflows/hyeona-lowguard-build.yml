name: Build Hyeona Low Guard v1.3
on:
  push:
    branches: [ hyeona-lowguard-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Nightscout dashboard fields
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://hyeona.up.railway.app'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'HyeonaLowGuard-build/1.3'})
              with urllib.request.urlopen(req,timeout=15) as r:return json.load(r)
          e=get('/api/v1/entries.json?count=1')[0]
          d=get('/api/v1/devicestatus.json?count=1')[0]
          p=d.get('pump',{}); oa=d.get('openaps',{}); sug=oa.get('suggested',{}); io=oa.get('iob',{})
          print('BG',e.get('sgv'),'IOB',io.get('iob',sug.get('IOB')),'COB',sug.get('COB'),
                'PUMP_BATT',p.get('battery',{}).get('percent'),'RES',p.get('reservoir'),
                'PUMP_STATUS',p.get('status',{}).get('status'),'UPLOADER',d.get('uploaderBattery'))
          PY
      - name: Recreate v1.1 project
        shell: bash
        run: |
          cat hyeona_build_parts/part*.txt > /tmp/hyeona.b64
          base64 -d /tmp/hyeona.b64 > /tmp/HyeonaLowGuard_Android_Project.zip
          mkdir -p /tmp/hyeona-src
          unzip -q /tmp/HyeonaLowGuard_Android_Project.zip -d /tmp/hyeona-src
      - name: Apply v1.2 prediction patch
        shell: bash
        run: |
          base64 -d hyeona_v12_patch.py.gz.b64 | gzip -d > /tmp/hyeona_v12_patch.py
          python /tmp/hyeona_v12_patch.py /tmp/hyeona-src/HyeonaLowGuard
      - name: Apply v1.3 dashboard and watch patch
        shell: bash
        run: |
          base64 -d hyeona_v13_patch.py.gz.b64 | gzip -d > /tmp/hyeona_v13_patch.py
          python /tmp/hyeona_v13_patch.py /tmp/hyeona-src/HyeonaLowGuard
          grep -q "versionName '1.3.0'" /tmp/hyeona-src/HyeonaLowGuard/app/build.gradle
          grep -q "include ':app', ':wear'" /tmp/hyeona-src/HyeonaLowGuard/settings.gradle
          test -f /tmp/hyeona-src/HyeonaLowGuard/wear/src/main/java/kr/hyeona/lowguard/wear/MainActivity.java
      - name: Build phone tablet APK
        working-directory: /tmp/hyeona-src/HyeonaLowGuard
        run: gradle :app:assembleDebug --stacktrace
      - name: Build Galaxy Watch APK
        working-directory: /tmp/hyeona-src/HyeonaLowGuard
        run: gradle :wear:assembleDebug --stacktrace
      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p /tmp/hyeona-apks
          cp /tmp/hyeona-src/HyeonaLowGuard/app/build/outputs/apk/debug/app-debug.apk /tmp/hyeona-apks/HyeonaLowGuard-v1.3-phone-tablet.apk
          cp /tmp/hyeona-src/HyeonaLowGuard/wear/build/outputs/apk/debug/wear-debug.apk /tmp/hyeona-apks/HyeonaLowGuard-v1.3-galaxy-watch.apk
          ls -lh /tmp/hyeona-apks
      - uses: actions/upload-artifact@v4
        with:
          name: HyeonaLowGuard-v1.3-APKs
          path: /tmp/hyeona-apks/*.apk
