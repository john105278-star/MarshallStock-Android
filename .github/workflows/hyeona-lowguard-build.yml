name: Build Hyeona Low Guard v1.3.2 Family Fit3
on:
  push:
    branches: [ hyeona-lowguard-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify Nightscout dashboard fields
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.request
          base='https://hyeona.up.railway.app'
          def get(path):
              req=urllib.request.Request(base+path,headers={'Cache-Control':'no-cache','User-Agent':'HyeonaLowGuard-build/1.3'})
              with urllib.request.urlopen(req,timeout=15) as r:return json.load(r)
          e=get('/api/v1/entries.json?count=1')[0]
          d=get('/api/v1/devicestatus.json?count=1')[0]
          p=d.get('pump',{}); oa=d.get('openaps',{}); sug=oa.get('suggested',{}); io=oa.get('iob',{})
          print('BG',e.get('sgv'),'IOB',io.get('iob',sug.get('IOB')),'COB',sug.get('COB'),
                'PUMP_BATT',p.get('battery',{}).get('percent'),'RES',p.get('reservoir'),
                'PUMP_STATUS',p.get('status',{}).get('status'),'UPLOADER',d.get('uploaderBattery'))
          PY
      - name: Recreate v1.1 project
        shell: bash
        run: |
          cat hyeona_build_parts/part*.txt > /tmp/hyeona.b64
          base64 -d /tmp/hyeona.b64 > /tmp/HyeonaLowGuard_Android_Project.zip
          mkdir -p /tmp/hyeona-src
          unzip -q /tmp/HyeonaLowGuard_Android_Project.zip -d /tmp/hyeona-src
      - name: Apply v1.2 prediction patch
        shell: bash
        run: |
          base64 -d hyeona_v12_patch.py.gz.b64 | gzip -d > /tmp/hyeona_v12_patch.py
          python /tmp/hyeona_v12_patch.py /tmp/hyeona-src/HyeonaLowGuard
      - name: Apply v1.3 dashboard and watch patch
        shell: bash
        run: |
          cat hyeona_v13_parts/part*.txt > /tmp/hyeona_v13_patch.b64
          test "$(wc -c < /tmp/hyeona_v13_patch.b64)" -eq 46268
          base64 -d /tmp/hyeona_v13_patch.b64 | gzip -d > /tmp/hyeona_v13_patch.py
          python /tmp/hyeona_v13_patch.py /tmp/hyeona-src/HyeonaLowGuard
          grep -q "versionName '1.3.0'" /tmp/hyeona-src/HyeonaLowGuard/app/build.gradle
          grep -q "include ':app', ':wear'" /tmp/hyeona-src/HyeonaLowGuard/settings.gradle
          test -f /tmp/hyeona-src/HyeonaLowGuard/wear/src/main/java/kr/hyeona/lowguard/wear/MainActivity.java
      - name: Apply conflict-free Family package
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          root=Path('/tmp/hyeona-src/HyeonaLowGuard')
          p=root/'app/build.gradle'
          s=p.read_text()
          s=s.replace("applicationId 'kr.hyeona.lowguard'","applicationId 'kr.hyeona.lowguard.family'")
          s=s.replace("versionCode 4","versionCode 5")
          s=s.replace("versionName '1.3.0'","versionName '1.3.1'")
          p.write_text(s)
          p=root/'wear/build.gradle'
          s=p.read_text()
          s=s.replace("applicationId 'kr.hyeona.lowguard.wear'","applicationId 'kr.hyeona.lowguard.family.wear'")
          s=s.replace("versionCode 1","versionCode 2")
          s=s.replace("versionName '1.0.0'","versionName '1.3.1'")
          p.write_text(s)
          for mf,label in [
              (root/'app/src/main/AndroidManifest.xml','현아 저혈 가드 Family'),
              (root/'wear/src/main/AndroidManifest.xml','현아 혈당 워치 Family')]:
              s=mf.read_text()
              if '워치' in label:
                  s=s.replace('android:label="현아 혈당 워치"', f'android:label="{label}"')
              else:
                  s=s.replace('android:label="현아 저혈 가드"', f'android:label="{label}"')
              mf.write_text(s)
          print((root/'app/build.gradle').read_text())
          print((root/'wear/build.gradle').read_text())
          PY
          grep -q "applicationId 'kr.hyeona.lowguard.family'" /tmp/hyeona-src/HyeonaLowGuard/app/build.gradle
          grep -q "applicationId 'kr.hyeona.lowguard.family.wear'" /tmp/hyeona-src/HyeonaLowGuard/wear/build.gradle
          grep -q "versionName '1.3.1'" /tmp/hyeona-src/HyeonaLowGuard/app/build.gradle

      - name: Apply Galaxy Fit3 notification bridge
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/hyeona-src/HyeonaLowGuard/app/src/main/java/kr/hyeona/lowguard/MonitorService.java')
          s=p.read_text()

          s=s.replace(
              'private static final int PREDICTION_ID = 1103;\n    private static final String CHANNEL_MONITOR = "monitor_v2";',
              'private static final int PREDICTION_ID = 1103;\n'
              '    private static final int FIT3_STATUS_ID = 1201;\n'
              '    private static final int FIT3_ALERT_ID = 1202;\n'
              '    private static final String CHANNEL_MONITOR = "monitor_v2";'
          )
          s=s.replace(
              'private static final String CHANNEL_ALARM = "alarm_v2";',
              'private static final String CHANNEL_ALARM = "alarm_v2";\n'
              '    private static final String CHANNEL_FIT3_STATUS = "fit3_status_v1";\n'
              '    private static final String CHANNEL_FIT3_ALERT = "fit3_alert_v1";'
          )
          s=s.replace(
              'private long lastKnownReadingDate = 0L;',
              'private long lastKnownReadingDate = 0L;\n    private long lastFit3ReadingDate = 0L;'
          )

          s=s.replace(
              '            Severity severity = classify(sgv, delta, direction, p);',
              '            postFit3GlucoseIfNew(date, sgv, delta, direction, extras);\n'
              '            Severity severity = classify(sgv, delta, direction, p);'
          )

          s=s.replace(
              '        nm.createNotificationChannel(alarm);',
              '        nm.createNotificationChannel(alarm);\n\n'
              '        NotificationChannel fitStatus = new NotificationChannel(\n'
              '                CHANNEL_FIT3_STATUS, "Galaxy Fit3 혈당 표시", NotificationManager.IMPORTANCE_DEFAULT);\n'
              '        fitStatus.setDescription("새 Nightscout 혈당이 들어올 때 Fit3에서 확인하기 위한 일반 알림");\n'
              '        fitStatus.setSound(null, null);\n'
              '        fitStatus.enableVibration(false);\n'
              '        fitStatus.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);\n'
              '        nm.createNotificationChannel(fitStatus);\n\n'
              '        NotificationChannel fitAlert = new NotificationChannel(\n'
              '                CHANNEL_FIT3_ALERT, "Galaxy Fit3 저혈 긴급 알림", NotificationManager.IMPORTANCE_HIGH);\n'
              '        fitAlert.setDescription("Fit3 미러링용 저혈·예측·수신중단 경고");\n'
              '        fitAlert.setSound(null, null);\n'
              '        fitAlert.enableVibration(true);\n'
              '        fitAlert.setVibrationPattern(new long[]{0, 500, 250, 500, 250, 800});\n'
              '        fitAlert.setLockscreenVisibility(Notification.VISIBILITY_PUBLIC);\n'
              '        nm.createNotificationChannel(fitAlert);'
          )

          s=s.replace(
              '        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n        nm.notify(ALARM_ID, b.build());',
              '        NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n'
              '        nm.notify(ALARM_ID, b.build());\n'
              '        postFit3Alert(title, body, test);'
          )

          s=s.replace(
              '        ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE)).notify(PREDICTION_ID, b.build());',
              '        ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE)).notify(PREDICTION_ID, b.build());\n'
              '        postFit3Alert(title, body, test);'
          )

          marker='    private void cancelAlarmNotification() {'
          methods=r'''
    private void postFit3GlucoseIfNew(long readingDate, int sgv, double delta, String direction, NightscoutExtras x) {
        if (readingDate <= 0L || readingDate == lastFit3ReadingDate) return;
        lastFit3ReadingDate = readingDate;
        String title = "현아 혈당 " + sgv + " " + arrowFor(direction);
        StringBuilder body = new StringBuilder(String.format(Locale.KOREA, "변화 %+.1f mg/dL", delta));
        if (x != null && !Double.isNaN(x.iob)) body.append(String.format(Locale.KOREA, " · IOB %.2fU", x.iob));
        if (x != null && x.pumpBattery >= 0) body.append(" · 펌프 ").append(x.pumpBattery).append("%");
        if (x != null && !Double.isNaN(x.reservoir)) body.append(String.format(Locale.KOREA, " · 잔량 %.0fU", x.reservoir));

        Intent open = new Intent(this, MainActivity.class);
        PendingIntent pi = PendingIntent.getActivity(this, 1201, open,
                PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
        Notification n = new Notification.Builder(this, CHANNEL_FIT3_STATUS)
                .setSmallIcon(R.drawable.ic_shield)
                .setContentTitle(title)
                .setContentText(body.toString())
                .setStyle(new Notification.BigTextStyle().bigText(body.toString()))
                .setCategory(Notification.CATEGORY_STATUS)
                .setVisibility(Notification.VISIBILITY_PUBLIC)
                .setPriority(Notification.PRIORITY_DEFAULT)
                .setOngoing(false)
                .setAutoCancel(true)
                .setContentIntent(pi)
                .build();
        ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE)).notify(FIT3_STATUS_ID, n);
    }

    private void postFit3Alert(String originalTitle, String body, boolean test) {
        Intent open = new Intent(this, MainActivity.class);
        PendingIntent pi = PendingIntent.getActivity(this, 1202, open,
                PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
        String title = (test ? "[Fit3 연동 테스트] " : "") + originalTitle;
        Notification n = new Notification.Builder(this, CHANNEL_FIT3_ALERT)
                .setSmallIcon(R.drawable.ic_alert)
                .setContentTitle(title)
                .setContentText(body)
                .setStyle(new Notification.BigTextStyle().bigText(body))
                .setCategory(Notification.CATEGORY_MESSAGE)
                .setVisibility(Notification.VISIBILITY_PUBLIC)
                .setPriority(Notification.PRIORITY_MAX)
                .setOngoing(false)
                .setAutoCancel(true)
                .setContentIntent(pi)
                .build();
        ((NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE)).notify(FIT3_ALERT_ID, n);
    }

'''
          if marker not in s:
              raise SystemExit('cancelAlarm marker missing')
          s=s.replace(marker, methods+marker, 1)
          p.write_text(s)

          g=Path('/tmp/hyeona-src/HyeonaLowGuard/app/build.gradle')
          gs=g.read_text().replace("versionCode 5","versionCode 6").replace("versionName '1.3.1'","versionName '1.3.2'")
          g.write_text(gs)

          print('Fit3 bridge patch applied')
          PY
          grep -q 'CHANNEL_FIT3_ALERT' /tmp/hyeona-src/HyeonaLowGuard/app/src/main/java/kr/hyeona/lowguard/MonitorService.java
          grep -q "versionName '1.3.2'" /tmp/hyeona-src/HyeonaLowGuard/app/build.gradle

      - name: Build phone tablet APK
        working-directory: /tmp/hyeona-src/HyeonaLowGuard
        run: gradle :app:assembleDebug --stacktrace
      - name: Build Galaxy Watch APK
        working-directory: /tmp/hyeona-src/HyeonaLowGuard
        run: gradle :wear:assembleDebug --stacktrace
      - name: Collect APKs
        shell: bash
        run: |
          mkdir -p /tmp/hyeona-apks
          cp /tmp/hyeona-src/HyeonaLowGuard/app/build/outputs/apk/debug/app-debug.apk /tmp/hyeona-apks/HyeonaLowGuard-v1.3.2-Family-Fit3-phone-tablet.apk
          cp /tmp/hyeona-src/HyeonaLowGuard/wear/build/outputs/apk/debug/wear-debug.apk /tmp/hyeona-apks/HyeonaLowGuard-v1.3.2-Family-galaxy-watch.apk
          ls -lh /tmp/hyeona-apks
      - uses: actions/upload-artifact@v4
        with:
          name: HyeonaLowGuard-v1.3.2-Family-Fit3-APKs
          path: /tmp/hyeona-apks/*.apk
