name: Build Hyeona Low Guard Tablet v1.4.0
on:
  push:
    branches: [ hyeona-lowguard-build ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Recreate v1.1 project
        shell: bash
        run: |
          cat hyeona_build_parts/part*.txt > /tmp/hyeona.b64
          base64 -d /tmp/hyeona.b64 > /tmp/HyeonaLowGuard_Android_Project.zip
          mkdir -p /tmp/hyeona-src
          unzip -q /tmp/HyeonaLowGuard_Android_Project.zip -d /tmp/hyeona-src

      - name: Apply v1.2 prediction patch
        shell: bash
        run: |
          base64 -d hyeona_v12_patch.py.gz.b64 | gzip -d > /tmp/hyeona_v12_patch.py
          python /tmp/hyeona_v12_patch.py /tmp/hyeona-src/HyeonaLowGuard

      - name: Apply v1.3 dashboard patch
        shell: bash
        run: |
          cat hyeona_v13_parts/part*.txt > /tmp/hyeona_v13_patch.b64
          test "$(wc -c < /tmp/hyeona_v13_patch.b64)" -eq 46268
          base64 -d /tmp/hyeona_v13_patch.b64 | gzip -d > /tmp/hyeona_v13_patch.py
          python /tmp/hyeona_v13_patch.py /tmp/hyeona-src/HyeonaLowGuard
          grep -q "versionName '1.3.0'" /tmp/hyeona-src/HyeonaLowGuard/app/build.gradle

      - name: Apply dark tablet UI and split alarm sounds
        shell: bash
        run: |
          base64 -d hyeona_tablet_patch.py.gz.b64 | gzip -d > /tmp/hyeona_tablet_patch.py
          python /tmp/hyeona_tablet_patch.py /tmp/hyeona-src/HyeonaLowGuard
          grep -q "applicationId 'kr.hyeona.lowguard.tablet'" /tmp/hyeona-src/HyeonaLowGuard/app/build.gradle
          grep -q "versionName '1.4.0'" /tmp/hyeona-src/HyeonaLowGuard/app/build.gradle
          grep -q 'TYPE_RINGTONE' /tmp/hyeona-src/HyeonaLowGuard/app/src/main/java/kr/hyeona/lowguard/MonitorService.java
          grep -q 'tablet ? 118 : 72' /tmp/hyeona-src/HyeonaLowGuard/app/src/main/java/kr/hyeona/lowguard/MainActivity.java

      - name: Build tablet APK
        working-directory: /tmp/hyeona-src/HyeonaLowGuard
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          mkdir -p /tmp/hyeona-tablet
          cp /tmp/hyeona-src/HyeonaLowGuard/app/build/outputs/apk/debug/app-debug.apk /tmp/hyeona-tablet/HyeonaLowGuard-Tablet-v1.4.0-Dark.apk
          ls -lh /tmp/hyeona-tablet/HyeonaLowGuard-Tablet-v1.4.0-Dark.apk

      - uses: actions/upload-artifact@v4
        with:
          name: HyeonaLowGuard-Tablet-v1.4.0-Dark
          path: /tmp/hyeona-tablet/HyeonaLowGuard-Tablet-v1.4.0-Dark.apk
